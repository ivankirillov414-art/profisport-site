name: Auto import 1C

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  workflow_run:
    workflows: ['Deploy ProfiSport to InfinityFree']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: profisport-auto-import-1c
  cancel-in-progress: false

jobs:
  import:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Detect and apply a new 1C export
        shell: bash
        env:
          PROFISPORT_IMPORT_SECRET: ${{ secrets.IMPORT_TOKEN || secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$PROFISPORT_IMPORT_SECRET" ] || { echo 'Import secret is not configured' >&2; exit 1; }

          BASE='https://ferryffggg.infinityfreeapp.com'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36'
          TOKEN="$(printf 'profisport-auto-import-v1:%s' "$PROFISPORT_IMPORT_SECRET" | sha256sum | awk '{print $1}')"

          request() {
            curl -fsS --retry 4 --retry-delay 4 --max-time 120               -A "$UA" -H 'Accept: application/json' -H "X-Import-Token: $TOKEN"               -X POST "$1"
          }

          CHECK="$(request "$BASE/api/import-apply.php?check=1")"
          echo "$CHECK" | jq -e '.ok == true' >/dev/null
          SOURCE="$(echo "$CHECK" | jq -r '.source // "unknown"')"
          SNAPSHOT="$(echo "$CHECK" | jq -r '.snapshot // empty')"
          CHANGED="$(echo "$CHECK" | jq -r '.changed // false')"
          STABLE="$(echo "$CHECK" | jq -r '.stable // false')"

          if [ "$CHANGED" != 'true' ]; then
            echo "No new 1C export: $SOURCE"
            {
              echo '### ProfiSport 1C auto-import'
              echo "- No changes: `$SOURCE` is already current."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$STABLE" != 'true' ]; then
            MODIFIED="$(echo "$CHECK" | jq -r '.modified_at // "unknown"')"
            echo "New export is still being copied; will retry later: $SOURCE ($MODIFIED)"
            {
              echo '### ProfiSport 1C auto-import'
              echo "- New export detected: `$SOURCE`."
              echo "- Files are still settling; import deferred until the next check."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          [ -n "$SNAPSHOT" ] || { echo 'Server did not return an export snapshot' >&2; exit 1; }
          OFFSET=0
          BATCH=0
          while :; do
            URL="$BASE/api/import-apply.php?offset=$OFFSET&limit=500&snapshot=$SNAPSHOT"
            RESPONSE="$(request "$URL")"
            echo "$RESPONSE" | jq -e '.ok == true' >/dev/null

            if [ "$(echo "$RESPONSE" | jq -r '.pending // false')" = 'true' ]; then
              echo 'Export returned to settling state; retrying on the next schedule.'
              exit 0
            fi
            if [ "$(echo "$RESPONSE" | jq -r '.unchanged // false')" = 'true' ]; then
              echo 'Another worker already activated this export.'
              break
            fi

            DONE="$(echo "$RESPONSE" | jq -r '.done // false')"
            NEXT="$(echo "$RESPONSE" | jq -r '.next_offset // 0')"
            TOTAL="$(echo "$RESPONSE" | jq -r '.total_rows // 0')"
            echo "Imported $NEXT / $TOTAL rows from $SOURCE"

            if [ "$DONE" = 'true' ]; then break; fi
            if [ "$NEXT" -le "$OFFSET" ]; then
              echo 'Importer did not advance to the next batch' >&2
              exit 1
            fi
            OFFSET="$NEXT"
            BATCH=$((BATCH+1))
            if [ "$BATCH" -gt 100 ]; then
              echo 'Import exceeded the batch safety limit' >&2
              exit 1
            fi
          done

          VERIFY="$(request "$BASE/api/import-apply.php?check=1")"
          echo "$VERIFY" | jq -e --arg snapshot "$SNAPSHOT" '.ok == true and .changed == false and .current_snapshot == $snapshot' >/dev/null

          ACTIVE="$(echo "$RESPONSE" | jq -r '.active_current_snapshot // "unknown"')"
          HIDDEN_ABSENT="$(echo "$RESPONSE" | jq -r '.hidden_not_in_snapshot // 0')"
          HIDDEN_ZERO="$(echo "$RESPONSE" | jq -r '.hidden_zero_stock // 0')"
          {
            echo '### ProfiSport 1C auto-import'
            echo "- Activated: `$SOURCE`."
            echo "- Active products: $ACTIVE."
            echo "- Hidden because absent: $HIDDEN_ABSENT."
            echo "- Hidden because stock is zero: $HIDDEN_ZERO."
          } >> "$GITHUB_STEP_SUMMARY"
