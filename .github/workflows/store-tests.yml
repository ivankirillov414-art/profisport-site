name: Store checks

on:
  workflow_dispatch:
  push:
    branches: [main, feature/store-orders]
    paths:
      - 'api/**'
      - 'server/**'
      - 'admin/**'
      - 'tests/**'
      - 'app.js'
      - 'catalog-loader.js'
      - 'checkout.js'
      - 'service.js'
      - 'service-guide.js'
      - 'service.html'
      - 'product-kant.js'
      - 'profile.html'
      - 'checkout.html'
      - 'product.html'
      - '.github/workflows/**'
  pull_request:

jobs:
  checkout:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        schema: [fresh, legacy]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: profisport_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -ptest-only-password" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax and validation
        run: |
          php -v
          find api server admin tests -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check app.js
          node --check catalog-loader.js
          node --check checkout.js
          node --check admin/orders.js
          node --check admin/products.js
          node --check admin/service.js
          node --check service.js
          node --check service-guide.js
          node --check product-kant.js
          php tests/order-validation.php
          php tests/catalog-quality.php
          node tests/mobile-layout-regression.js
          node tests/catalog-taxonomy-regression.js
      - name: Verify order and catalog schema invariants
        run: |
          grep -Fq 'source_hash,name,slug,sku' api/import-apply.php
          grep -Fq 'SELECT id,name,price_rub,stock_qty,stock_status,availability,is_active FROM products' api/order-create.php
          grep -Fq "action==='favorites_merge'" api/customer.php
          grep -Fq "action==='order'" api/customer.php
          grep -Fq "COALESCE(price_rub,0)>0" api/catalog.php
          grep -Fq "catalog_sanitize_specs" api/catalog.php
          grep -Fq "catalog_sanitize_old_price" api/catalog.php
          grep -Fq "catalog_resolve_brand" api/catalog.php
          grep -Fq "brands_inferred" api/catalog.php
      - name: Test checkout with a disposable database
        run: |
          cat > server/config.php <<'PHP'
          <?php return ['db_host'=>'127.0.0.1','db_name'=>'profisport_test','db_user'=>'root','db_pass'=>'test-only-password','import_token'=>'test'];
          PHP
          if [ '${{ matrix.schema }}' = legacy ]; then php tests/legacy-orders.php; fi
          php tests/seed.php
          php -S 127.0.0.1:8080 > /tmp/profisport-test.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in 1 2 3 4 5; do
            curl -s http://127.0.0.1:8080/ > /dev/null && break
            sleep 1
          done
          python3 tests/orders-http.py
          if [ '${{ matrix.schema }}' = legacy ]; then php tests/legacy-order-writes.php; fi
