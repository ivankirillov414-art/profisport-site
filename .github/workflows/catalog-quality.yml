name: Catalog quality audit

on:
  workflow_dispatch:
  schedule:
    - cron: '41 1 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/catalog_audit.py'
      - 'catalog-loader.js'
      - 'app.js'
      - 'index.html'
      - 'data/catalog-*.json'
      - '.github/workflows/catalog-quality.yml'

permissions:
  contents: write

concurrency:
  group: profisport-catalog-quality
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check storefront JavaScript syntax
        run: |
          node --check catalog-loader.js
          node --check app.js

      - name: Build catalog audit
        run: python3 scripts/catalog_audit.py

      - name: Validate audit report
        run: |
          python3 - <<'PY'
          import json
          j=json.load(open('data/catalog-audit.json',encoding='utf-8'))
          assert j['catalog_rows'] > 8000, j['catalog_rows']
          assert isinstance(j['summary'],dict)
          assert isinstance(j['issues'],list)
          print(j['summary'])
          PY

      - name: Commit changed audit report
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/catalog-audit.json)" ]; then
            echo 'Catalog audit unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog-audit.json
          git commit -m 'Update catalog quality audit'
          git pull --rebase origin main
          git push origin HEAD:main
