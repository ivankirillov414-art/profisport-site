name: Deploy ProfiSport motion hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-motion-hotfix.yml'
      - 'index.html'
      - 'catalog-loader.js'
      - 'psf-final-motion.css'
      - 'psf-final-motion.js'
      - 'assets/hero/classic-mountains-v1.webp'
      - 'assets/hero/profisport-motion-route-v1.webp'
      - 'assets/categories/bicycle-illustration-v1.png'
      - 'assets/categories/parts-illustration-v1.png'
      - 'assets/categories/accessories-illustration-v1.png'
      - 'assets/categories/skiing-illustration-v2.png'
      - 'assets/categories/fitness-illustration-v1.png'
      - 'assets/categories/tourism-illustration-v2.png'
      - 'assets/categories/scooter-illustration-v2.png'
  workflow_dispatch:

concurrency:
  group: profisport-motion-hotfix
  cancel-in-progress: true

jobs:
  deploy-motion-hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate motion hotfix files
        run: |
          set -euo pipefail
          node --check psf-final-motion.js
          grep -Eq 'psf-final-motion.css\?v=[0-9]+' index.html
          grep -Eq 'psf-final-motion.js\?v=[0-9]+' index.html
          grep -Fq 'psfSceneHero' index.html
          grep -Fq 'classic-mountains-v1.webp' index.html
          grep -Fq 'profisport-motion-route-v1.webp' index.html
          grep -Fq 'profisport-motion-route-v1.webp' psf-final-motion.js
          grep -Fq 'bicycle-illustration-v1.png' index.html
          grep -Fq 'scooter-illustration-v2.png' index.html
          test -s assets/hero/classic-mountains-v1.webp
          test -s assets/hero/profisport-motion-route-v1.webp
          test -s assets/categories/bicycle-illustration-v1.png
          test -s assets/categories/parts-illustration-v1.png
          test -s assets/categories/accessories-illustration-v1.png
          test -s assets/categories/skiing-illustration-v2.png
          test -s assets/categories/fitness-illustration-v1.png
          test -s assets/categories/tourism-illustration-v2.png
          test -s assets/categories/scooter-illustration-v2.png
          grep -Fq 'Ролики и скейты' index.html
          grep -Fq 'Ролики и скейты' catalog-loader.js
          grep -Fq 'psf-scene-bike-in' psf-final-motion.css
          grep -Fq 'psf-enter' psf-final-motion.js

      - name: Stage only motion hotfix files
        run: |
          set -euo pipefail
          mkdir -p hotfix-upload/assets/hero hotfix-upload/assets/categories
          cp index.html catalog-loader.js psf-final-motion.css psf-final-motion.js hotfix-upload/
          cp assets/hero/classic-mountains-v1.webp hotfix-upload/assets/hero/
          cp assets/hero/profisport-motion-route-v1.webp hotfix-upload/assets/hero/
          cp assets/categories/bicycle-illustration-v1.png hotfix-upload/assets/categories/
          cp assets/categories/parts-illustration-v1.png hotfix-upload/assets/categories/
          cp assets/categories/accessories-illustration-v1.png hotfix-upload/assets/categories/
          cp assets/categories/skiing-illustration-v2.png hotfix-upload/assets/categories/
          cp assets/categories/fitness-illustration-v1.png hotfix-upload/assets/categories/
          cp assets/categories/tourism-illustration-v2.png hotfix-upload/assets/categories/
          cp assets/categories/scooter-illustration-v2.png hotfix-upload/assets/categories/

      - name: Deploy staged hotfix files to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287
        with:
          server: ftpupload.net
          username: if0_42771076
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./hotfix-upload/
          server-dir: /htdocs/
          state-name: .psf-motion-hotfix-sync-state.json
          dangerous-clean-slate: false
          log-level: standard
