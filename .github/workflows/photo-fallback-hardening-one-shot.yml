name: One-shot DB photo fallback hardening
on:
  push:
    branches: [fix/photo-source-integrity-20260910]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Harden emergency catalog fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('catalog-loader.js')
          s=p.read_text(encoding='utf-8')
          anchor="async function loadRealCatalog(){"
          helper=("function staticRowWithDbPhotoFallback(row){\n"
                  "  const name=String(row?.title??row?.name??'').trim();\n"
                  "  if(!name)return row;\n"
                  "  const path=Array.isArray(row?.category_path)?row.category_path:[];\n"
                  "  const cat=String(path[path.length-1]??'').trim();\n"
                  "  const params=new URLSearchParams({name});\n"
                  "  if(cat)params.set('cat',cat);\n"
                  "  const brand=String(row?.brand??'').trim();\n"
                  "  const model=String(row?.model??'').trim();\n"
                  "  if(brand)params.set('brand',brand);\n"
                  "  if(model)params.set('model',model);\n"
                  "  const resolver=`api/product-db-image.php?${params.toString()}`;\n"
                  "  const parserImages=Array.isArray(row?.images)?row.images.filter(Boolean):[];\n"
                  "  return{...row,image:resolver,main_image:resolver,images:[resolver,...parserImages]};\n"
                  "}\n")
          if 'function staticRowWithDbPhotoFallback(row)' not in s:
              if anchor not in s: raise SystemExit('loadRealCatalog anchor missing')
              s=s.replace(anchor,helper+anchor,1)
          old="window.CATALOG_SOURCE='static';\n    return arrays.flat().filter(isPurchasableCatalogRow).map(normalizeProduct)"
          new="window.CATALOG_SOURCE='static-db-photo-resolver';\n    window.CATALOG_PHOTO_SOURCE='mysql-resolver+parser-emergency';\n    window.CATALOG_PARSER_ROWS_WITH_IMAGES=Number(manifest.parser_rows_with_images)||0;\n    return arrays.flat().filter(isPurchasableCatalogRow).map(staticRowWithDbPhotoFallback).map(normalizeProduct)"
          if old in s:
              s=s.replace(old,new,1)
          elif "map(staticRowWithDbPhotoFallback).map(normalizeProduct)" not in s:
              raise SystemExit('static fallback pattern missing')
          p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('catalog-loader.js?v=20','catalog-loader.js?v=21',1)
          p.write_text(s,encoding='utf-8')

          p=Path('tests/catalog-live-source-regression.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("if(!loader.includes(\"window.CATALOG_SOURCE='static'\"))fail('base loader static fallback diagnostic is missing');",
                      "if(loader.includes(\"window.CATALOG_SOURCE='static';\"))fail('base loader must not expose raw parser static photos');\nif(!loader.includes(\"window.CATALOG_SOURCE='static-db-photo-resolver'\"))fail('base loader emergency fallback must resolve photos against MySQL');\nif(!loader.includes('map(staticRowWithDbPhotoFallback).map(normalizeProduct)'))fail('base loader must prepend the DB photo resolver before parser images');",1)
          if "base loader must prepend the DB photo resolver" not in s:
              raise SystemExit('regression test base fallback patch missing')
          p.write_text(s,encoding='utf-8')
          PY
          node --check catalog-loader.js
          node tests/catalog-live-source-regression.js
          node tests/mobile-layout-regression.js
          php tests/catalog-quality.php
      - name: Commit hardening to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog-loader.js index.html tests/catalog-live-source-regression.js
          git diff --cached --quiet && { echo 'No hardening changes to commit.'; exit 1; }
          git commit -m 'Resolve emergency catalog photos from MySQL before parser data'
          git pull --rebase origin main
          git push origin HEAD:main
