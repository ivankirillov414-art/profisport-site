name: Product links for 2GIS
on:
  pull_request:
    paths: ['admin/product-links.*', 'admin/sections.php', 'tests/product-links-browser.py', '.github/workflows/product-links.yml']
  push:
    branches: [main]
    paths: ['admin/product-links.*', 'admin/sections.php', 'tests/product-links-browser.py', '.github/workflows/product-links.yml']
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check PHP and JavaScript
        run: |
          php -l admin/product-links.php
          php -l admin/sections.php
          node --check admin/product-links.js
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Test product links and clipboard
        run: python tests/product-links-browser.py
