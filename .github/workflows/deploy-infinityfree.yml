name: Deploy ProfiSport to InfinityFree

on:
  push:
    branches: [main]
    paths-ignore: ['cms/**', '.github/workflows/deploy-cms.yml']
  workflow_dispatch:

concurrency:
  group: infinityfree-deploy
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        schema: [fresh, legacy]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: profisport_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -ptest-only-password" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate application and regressions
        run: |
          php -v
          find api server admin tests -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check app.js
          node --check catalog-loader.js
          node --check catalog-live-paged.js
          node --check checkout.js
          node --check admin/orders.js
          node --check admin/products.js
          node --check admin/service.js
          node --check admin/loyalty-calculator.js
          node --check service.js
          node --check service-guide.js
          node --check product-kant.js
          node tests/product-loader-regression.js
          node tests/cart-quantity-regression.js
          node tests/product-gallery-regression.js
          node tests/mobile-layout-regression.js
          node tests/catalog-taxonomy-regression.js
          node tests/catalog-live-source-regression.js
          node tests/current-export-regression.js
          node tests/migration-readiness.js
          node tests/photo-source-ownership.js
          node tests/catalog-startup-regression.js
          node tests/security-regression.js
          node tests/profile-dashboard-regression.js
          node tests/profile-orders-regression.js
          node tests/profile-favorites-regression.js
          node tests/profile-reviews-regression.js
          node tests/profile-block5-cookie-regression.js
          node tests/profile-phone-login-regression.js
          node tests/customer-phone-login-regression.js
          node tests/profile-vehicles-service-regression.js
          node tests/vehicle-passport-regression.js
          node tests/vehicle-spec-registry-regression.js
          node tests/admin-customer-card-regression.js
          node tests/loyalty-foundation-regression.js
          node tests/loyalty-calculator-regression.js
          node tests/loyalty-live-regression.js
          node tests/production-preflight-regression.js
          php tests/order-validation.php
          php tests/loyalty-math.php
          php tests/catalog-quality.php
          php tests/source-photo-diagnostic.php
          php tests/source-photo-reconcile.php
      - name: Verify runtime on disposable database
        run: |
          cat > server/config.php <<'PHP'
          <?php return ['db_host'=>'127.0.0.1','db_name'=>'profisport_test','db_user'=>'root','db_pass'=>'test-only-password','import_token'=>'test'];
          PHP
          if [ '${{ matrix.schema }}' = legacy ]; then php tests/legacy-orders.php; fi
          php tests/seed.php
          php tests/loyalty-discounts.php
          php tests/loyalty-live.php
          php tests/vehicle-passport.php
          php tests/vehicle-spec-registry.php
          php -S 127.0.0.1:8080 > /tmp/profisport-preflight.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in 1 2 3 4 5; do
            curl -s http://127.0.0.1:8080/ > /dev/null && break
            sleep 1
          done
          python3 tests/orders-http.py
          python3 tests/phone-login-http.py
          if [ '${{ matrix.schema }}' = legacy ]; then php tests/legacy-order-writes.php; fi

  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify storefront regressions
        run: |
          find cms -name "*.php" -print0 | xargs -0 -n1 php -l
          php -l admin/cms-setup.php
          node --check cms/editor.js
          node --check cms-client.js
          php cms/tests/validation.php
          php -l api/catalog.php
          php -l api/customer.php
          php -l api/customer-admin.php
          php -l server/bootstrap.php
          node --check customer-register.js
          node --check product-related.js
          node --check product-kant.js
          node --check service-guide.js
          node --check catalog-live-paged.js
          node tests/mobile-layout-regression.js
          node tests/hero-slides-regression.js
          node tests/catalog-taxonomy-regression.js
          node tests/catalog-live-source-regression.js
          node tests/current-export-regression.js
          node tests/migration-readiness.js
          node tests/photo-source-ownership.js
          node tests/catalog-startup-regression.js
          node tests/cart-quantity-regression.js
          node tests/product-gallery-regression.js
          node tests/security-regression.js
          node tests/profile-dashboard-regression.js
          node tests/profile-orders-regression.js
          node tests/profile-favorites-regression.js
          node tests/profile-reviews-regression.js
          node tests/profile-block5-cookie-regression.js
          node tests/profile-phone-login-regression.js
          node tests/customer-phone-login-regression.js
          node tests/profile-vehicles-service-regression.js
          node tests/admin-customer-card-regression.js
          node tests/loyalty-foundation-regression.js
          node tests/loyalty-calculator-regression.js
          node tests/loyalty-live-regression.js
          node tests/production-preflight-regression.js
          php tests/loyalty-math.php
          php tests/catalog-quality.php
          php tests/source-photo-diagnostic.php
          php tests/source-photo-reconcile.php
          node --check admin/analyze.js
          node --check admin/reconcile.js
          node --check admin/import-run.js
          node --check admin/import-apply.js
          node --check admin/migration.js
          node --check admin/loyalty-calculator.js
          php -l admin/migration.php
          php -l api/migration.php
          php -l api/migration-tick.php
          php -l server/migration.php
          php -l server/loyalty.php
          php -l server/loyalty-center.php
          php -l server/customer-vehicles.php
          php -l server/vehicle-passport.php
          php -l server/vehicle-spec-registry.php
          php -l api/vehicle-spec-admin.php
          php -l admin/vehicle-specs.php
          php -l api/vehicle-passport-admin.php
          php -l admin/vehicle.php
          php -l api/loyalty-admin.php
          php -l api/review-moderation.php
          php -l admin/loyalty.php

      - name: Build private server config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p server
          PASS_B64="$(printf '%s' "$PROFISPORT_DB_PASSWORD" | base64 -w 0)"
          IMPORT_TOKEN="$(printf 'profisport-auto-import-v1:%s' "$PROFISPORT_IMPORT_SECRET" | sha256sum | awk '{print $1}')"
          TOKEN_B64="$(printf '%s' "$IMPORT_TOKEN" | base64 -w 0)"
          MIGRATION_KEY="$(printf '%s' "profisport-migration-v1:${PROFISPORT_DB_PASSWORD}" | sha256sum | awk '{print $1}')"
          MIGRATION_TICK_TOKEN="$(printf '%s' "profisport-migration-tick-v1:${PROFISPORT_DB_PASSWORD}" | sha256sum | awk '{print $1}')"
          MIGRATION_B64="$(printf '%s' "$MIGRATION_KEY" | base64 -w 0)"
          MIGRATION_TICK_B64="$(printf '%s' "$MIGRATION_TICK_TOKEN" | base64 -w 0)"
          cat > server/config.php <<PHP
          <?php
          return [
              'db_host' => 'sql202.infinityfree.com',
              'db_port' => 3306,
              'db_name' => 'if0_42771076_profisport',
              'db_user' => 'if0_42771076',
              'db_pass' => base64_decode('${PASS_B64}', true),
              'import_token' => base64_decode('${TOKEN_B64}', true),
              'migration_key' => base64_decode('${MIGRATION_B64}', true),
              'migration_tick_token' => base64_decode('${MIGRATION_TICK_B64}', true),
          ];
          PHP
          chmod 600 server/config.php
        env:
          PROFISPORT_DB_PASSWORD: ${{ secrets.DB_PASSWORD || secrets.FTP_PASSWORD }}
          PROFISPORT_IMPORT_SECRET: ${{ secrets.IMPORT_TOKEN || secrets.FTP_PASSWORD }}

      - name: Deploy to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ftpupload.net
          username: if0_42771076
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          server-dir: /htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            import/**
            uploads/**
            cms/**
            tests/**
            docs/**
            server/config.example.php

      - name: Install image verification dependency
        run: python3 -m pip install 'Pillow==11.3.0'

      - name: Verify uploaded files over FTP
        shell: bash
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          FTP_ROOT='ftp://ftpupload.net:21/htdocs'
          AUTH="if0_42771076:${FTP_PASSWORD}"
          mkdir -p /tmp/profisport-remote/api /tmp/profisport-remote/server /tmp/profisport-remote/admin

          # Image encoders may change bytes; verify decoded full-resolution pixels.
          verify_image() {
            python3 - "$1" "$2" <<'PY'
          import sys
          from PIL import Image, ImageChops, ImageStat
          with Image.open(sys.argv[1]) as source, Image.open(sys.argv[2]) as remote:
              source.load()
              remote.load()
              if source.size != remote.size or getattr(remote, "n_frames", 1) != 1:
                  raise SystemExit("Image dimensions or frame count changed")
              error = max(ImageStat.Stat(ImageChops.difference(source.convert("RGBA"), remote.convert("RGBA"))).rms)
              if error > 5:
                  raise SystemExit(f"Image content differs: maximum channel RMS {error:.3f}")
              print(f"Verified image dimensions {source.size} and decoded pixels (RMS {error:.3f})")
          PY
          }

          for file in 404.html 500.html hero-slides-v5.css assets/hero/classic-workshop-wide-v5.webp assets/hero/classic-workshop-mobile-v5.webp assets/hero/winter-storage-v10.webp cms-client.js admin/cms-setup.php assets/hero/classic-workshop-reference-v4.webp assets/brand/profisport-logo-classic.svg ui-refinements-v4.css workshop.html shop.html workshop.html section-pages.css index.html app.js storefront-v2.css assets/promo/winter-storage-original.jpeg assets/hero/winter-storage-v10.webp assets/brand/favicon-profisport-v1.svg assets/brand/favicon-profisport-v1.png .htaccess admin/recover-access.php api/order-create.php api/service.php api/product-db-image.php category-tiles.css assets/categories/bicycle-illustration-v1.png assets/categories/scooter-illustration-v2.png assets/categories/skiing-illustration-v2.png assets/categories/parts-illustration-v1.png assets/categories/accessories-illustration-v1.png assets/categories/fitness-illustration-v1.png assets/categories/tourism-illustration-v2.png buyer-info.html buyer-info.css buyer-info.js index.html product.html checkout.html profile.html profile-dashboard.css cookie-consent.css cookie-consent.js service.html checkout.js product-related.js product-info.css product-kant.js service.js service-guide.js storefront-v2.css storefront-v2-base.css classic-theme.css header-compact.css customer-register.css customer-register.js assets/customer-registration-qr.svg assets/brand/profisport-logo-classic.svg assets/hero/classic-mountains-v1.webp app.js catalog-loader.js catalog-live-paged.js api/health.php api/catalog.php api/customer.php api/customer-admin.php api/vehicle-passport-admin.php api/vehicle-spec-admin.php api/orders.php api/order-create.php api/review-moderation.php api/loyalty-admin.php api/photo-audit.php api/import-analyze.php api/import-apply.php api/import-reconcile.php api/migration.php api/migration-tick.php server/bootstrap.php server/catalog-quality.php server/import-safety.php server/migration.php server/loyalty.php server/loyalty-center.php server/customer-vehicles.php server/vehicle-passport.php server/vehicle-spec-registry.php server/order-schema.php server/order-validation.php server/source-photo-diagnostic.php server/source-photo-reconcile.php admin/analyze.js admin/import-run.js admin/import-apply.js admin/migration.js admin/migration.php admin/reconcile.js admin/app.js admin/orders.js admin/orders.php admin/reviews.php admin/loyalty.php admin/loyalty-calculator.js admin/loyalty-calculator.css admin/service.js admin/service.php admin/index.php admin/customers.php admin/customer.php admin/vehicle.php admin/vehicle-specs.php admin/customer-qr.php; do
            mkdir -p "$(dirname "/tmp/profisport-remote/$file")"
            echo "Downloading deployed $file for byte-for-byte verification"
            curl -fsS --ssl-reqd --retry 4 --retry-delay 2 --max-time 60 \
              --user "$AUTH" "$FTP_ROOT/$file;type=i" -o "/tmp/profisport-remote/$file"
            case "$file" in
            *.jpeg|*.jpg|*.png|*.webp)
              if verify_image "$file" "/tmp/profisport-remote/$file"; then continue; fi
              ;;
          esac
          cmp -s "$file" "/tmp/profisport-remote/$file" || {
              echo "Remote $file differs; re-uploading over verified TLS"
              curl -fsS --ssl-reqd --max-time 60 --user "$AUTH" -T "$file" "$FTP_ROOT/$file;type=i"
              curl -fsS --ssl-reqd --max-time 60 --user "$AUTH" "$FTP_ROOT/$file;type=i" -o "/tmp/profisport-remote/$file"
              case "$file" in
              *.jpeg|*.jpg|*.png|*.webp)
                verify_image "$file" "/tmp/profisport-remote/$file"
                continue
                ;;
            esac
            cmp -s "$file" "/tmp/profisport-remote/$file" || { echo "Verification still failed: $file" >&2; file "$file" "/tmp/profisport-remote/$file"; wc -c "$file" "/tmp/profisport-remote/$file"; sha256sum "$file" "/tmp/profisport-remote/$file"; head -c 64 "/tmp/profisport-remote/$file" | od -An -tx1; exit 1; }
            }
          done

          grep -Eq 'storefront-v2\.css\?v=[0-9]+' /tmp/profisport-remote/index.html
          grep -Eq 'app\.js\?v=[0-9]+' /tmp/profisport-remote/index.html
          grep -Eq 'catalog-loader\.js\?v=[0-9]+' /tmp/profisport-remote/index.html
          grep -Eq 'catalog-live-paged\.js\?v=[0-9]+' /tmp/profisport-remote/index.html
          grep -Eq 'product-kant\.js\?v=([3-9]|[1-9][0-9]+)("|&)' /tmp/profisport-remote/product.html
          grep -Fq 'cart.findIndex(x=>String(x)===id)' /tmp/profisport-remote/app.js
          if grep -Fq 'cart.findIndex(x=>String(x.id)===id)' /tmp/profisport-remote/app.js; then
            echo 'Old cart decrement bug is present in deployed app.js' >&2
            exit 1
          fi
          grep -Fq "COALESCE(price_rub,0)>0" /tmp/profisport-remote/api/catalog.php
          grep -Fq "COALESCE(stock_qty,0)>0" /tmp/profisport-remote/api/catalog.php
          grep -Fq "current_1c_snapshot" /tmp/profisport-remote/api/import-apply.php
          grep -Fq "source_settling" /tmp/profisport-remote/api/import-apply.php
          grep -Fq "\$_GET['check']" /tmp/profisport-remote/api/import-apply.php
          grep -Fq "catalog_sanitize_specs" /tmp/profisport-remote/api/catalog.php
          grep -Fq "catalog_resolve_brand" /tmp/profisport-remote/api/catalog.php
          grep -Fq "brands_inferred" /tmp/profisport-remote/api/catalog.php
          grep -Fq 'ErrorDocument 404 /404.html' /tmp/profisport-remote/.htaccess
          grep -Fq 'ErrorDocument 500 /500.html' /tmp/profisport-remote/.htaccess
          grep -Fq 'Ошибка 404' /tmp/profisport-remote/404.html
          grep -Fq 'Ошибка 500' /tmp/profisport-remote/500.html
          grep -Fq 'История действий' /tmp/profisport-remote/admin/customer.php
          grep -Fq 'Паспорт техники' /tmp/profisport-remote/admin/vehicle.php
          grep -Fq 'Покрытие паспортов техники' /tmp/profisport-remote/admin/vehicle-specs.php
          grep -Fq 'vehicle_spec_registry_profiles' /tmp/profisport-remote/server/vehicle-spec-registry.php
          grep -Fq 'vehicle_passport_payload' /tmp/profisport-remote/server/vehicle-passport.php
          if grep -Eq 'mobile-layout-fix|mobile-viewport-lock|storefront-kant|theme-clean-v1' /tmp/profisport-remote/index.html; then
            echo 'Obsolete layout assets are present in deployed index.html' >&2
            exit 1
          fi
          echo 'InfinityFree FTP contents match the repository.'

      - name: Apply verified vehicle spec registry
        shell: bash
        env:
          PROFISPORT_DB_PASSWORD: ${{ secrets.DB_PASSWORD || secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "profisport-migration-tick-v1:${PROFISPORT_DB_PASSWORD}" | sha256sum | awk '{print $1}')"
          CODE="$(curl -sS --retry 3 --retry-delay 3 --max-time 65             -A 'Mozilla/5.0 ProfiSport-Post-Deploy/1.0'             -H 'Accept: application/json'             -H "X-Migration-Token: $TOKEN"             -X POST 'https://ferryffggg.infinityfreeapp.com/api/migration-tick.php'             -o /tmp/post-deploy-maintenance.body -w '%{http_code}')"
          export CODE
          python3 - <<'PY'
          import json, os, pathlib
          code=int(os.environ.get('CODE') or 0)
          body=pathlib.Path('/tmp/post-deploy-maintenance.body').read_text(encoding='utf-8',errors='replace')
          try:
              payload=json.loads(body)
          except json.JSONDecodeError:
              payload=None
          if isinstance(payload,dict):
              assert payload.get('ok') is True, payload
              vehicle=payload.get('vehicle_specs') or {}
              assert vehicle.get('version'), payload
              print('vehicle spec maintenance:', vehicle)
              raise SystemExit(0)
          lower=body.lower()
          if any(x in lower for x in ('<html','<!doctype','aes.js','javascript is required')):
              print(f'InfinityFree browser challenge intercepted post-deploy maintenance tick (HTTP {code}); scheduled/same-origin fallback remains active.')
              raise SystemExit(0)
          raise SystemExit(f'Unexpected maintenance response HTTP {code}: {body[:1000]}')
          PY

      - name: Smoke-check public InfinityFree endpoint
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ferryffggg.infinityfreeapp.com'
          BUST="${GITHUB_SHA}-${GITHUB_RUN_NUMBER}"
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'

          curl -fsSIL --retry 4 --retry-delay 3 --max-time 30 -A "$UA" \
            "$BASE/?deploy=$BUST" | sed -n '1,40p'
          curl -fsSL --retry 4 --retry-delay 3 --max-time 30 -A "$UA" \
            "$BASE/?deploy=$BUST" -o /tmp/live.html

          if grep -Eq '/aes\.js|aes\.js' /tmp/live.html; then
            echo 'InfinityFree returned its anti-bot browser challenge to the CI runner.'
            echo 'Public endpoint is reachable; deployed bytes were verified separately over FTP.'
            exit 0
          fi

          grep -Eq 'storefront-v2\.css\?v=[0-9]+' /tmp/live.html
          grep -Eq 'app\.js\?v=[0-9]+' /tmp/live.html
          grep -Eq 'catalog-loader\.js\?v=[0-9]+' /tmp/live.html
          grep -Eq 'catalog-live-paged\.js\?v=[0-9]+' /tmp/live.html
          if grep -Eq 'mobile-layout-fix|mobile-viewport-lock|storefront-kant|theme-clean-v1' /tmp/live.html; then
            echo 'Obsolete layout assets are still present in live HTML' >&2
            exit 1
          fi
          echo 'Public InfinityFree storefront HTML passed the smoke check.'

      - name: Smoke-check public health and 404
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ferryffggg.infinityfreeapp.com'
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'

          HEALTH_CODE="$(curl -sS --retry 3 --retry-delay 3 --max-time 30 -A "$UA" "$BASE/api/health.php?deploy=${GITHUB_SHA}" -o /tmp/live-health -w '%{http_code}')"
          if grep -Eqi '/aes\.js|aes\.js|javascript is required' /tmp/live-health; then
            echo 'InfinityFree browser challenge intercepted public health smoke; FTP verification remains authoritative for deployed bytes.'
          else
            test "$HEALTH_CODE" = "200"
            python3 - <<'PY'
          import json
          payload=json.load(open('/tmp/live-health',encoding='utf-8'))
          assert payload.get('ok') is True, payload
          assert payload.get('database') is True, payload
          assert payload.get('schema') is True, payload
          print('Public health endpoint passed:', payload)
          PY
          fi

          MISS_CODE="$(curl -sS --retry 3 --retry-delay 3 --max-time 30 -A "$UA" "$BASE/profisport-preflight-missing-${GITHUB_SHA}" -o /tmp/live-404 -w '%{http_code}')"
          if grep -Eqi '/aes\.js|aes\.js|javascript is required' /tmp/live-404; then
            echo 'InfinityFree browser challenge intercepted public 404 smoke.'
          else
            test "$MISS_CODE" = "404"
            grep -Fq 'Ошибка 404' /tmp/live-404
            echo 'Public branded 404 passed.'
          fi

      - name: Report live photo audit status
        run: |
          echo 'LIVE_MYSQL_PHOTO_AUDIT=NOT_RUN'
          echo 'CI verifies deployed files over FTP. It does not certify MySQL photo linkage.'
          echo 'Live MySQL photo audit: not run. InfinityFree requires an authenticated browser workflow; deployment success is not an audit result.' >> "$GITHUB_STEP_SUMMARY"

      - name: Stock safety note
        run: |
          echo "Catalog writes are manual only."
          echo "The importer validates the verified stock field before changing product availability."

