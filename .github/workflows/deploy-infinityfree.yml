name: Deploy ProfiSport to InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: infinityfree-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build private server config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p server
          PASS_B64="$(printf '%s' "$PROFISPORT_DB_PASSWORD" | base64 -w 0)"
          TOKEN_B64="$(printf '%s' "$PROFISPORT_IMPORT_TOKEN" | base64 -w 0)"
          cat > server/config.php <<PHP
          <?php
          return [
              'db_host' => 'sql202.infinityfree.com',
              'db_name' => 'if0_42771076_profisport',
              'db_user' => 'if0_42771076',
              'db_pass' => base64_decode('${PASS_B64}', true),
              'import_token' => base64_decode('${TOKEN_B64}', true),
          ];
          PHP
          chmod 600 server/config.php
        env:
          PROFISPORT_DB_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          PROFISPORT_IMPORT_TOKEN: ${{ secrets.CATALOG_TOKEN }}

      - name: Deploy to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ftpupload.net
          username: if0_42771076
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            import/**
            uploads/**

      - name: Import current 1C catalog into MySQL
        shell: bash
        env:
          PROFISPORT_IMPORT_TOKEN: ${{ secrets.CATALOG_TOKEN }}
        run: |
          set -euo pipefail
          sleep 12
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          echo 'Checking site health'
          curl --http1.1 --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 \
            -A "$UA" \
            'https://ferryffggg.infinityfreeapp.com/server/api.php?action=health' || true
          offset=0
          for attempt in $(seq 1 30); do
            echo "Import batch offset=$offset"
            body="$(curl --http1.1 --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 \
              -A "$UA" \
              -X POST \
              -H "X-Import-Token: ${PROFISPORT_IMPORT_TOKEN}" \
              "https://ferryffggg.infinityfreeapp.com/api/import-apply.php?offset=${offset}&limit=500")"
            echo "$body"
            ok="$(printf '%s' "$body" | jq -r '.ok // false')"
            [ "$ok" = "true" ] || exit 1
            done_flag="$(printf '%s' "$body" | jq -r '.done // false')"
            if [ "$done_flag" = "true" ]; then
              total="$(printf '%s' "$body" | jq -r '.total_rows')"
              echo "1C import complete: ${total} rows"
              exit 0
            fi
            offset="$(printf '%s' "$body" | jq -r '.next_offset')"
            sleep 1
          done
          echo "Import did not finish within 30 batches" >&2
          exit 1
