name: Deploy ProfiSport to InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: infinityfree-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify storefront regressions
        run: |
          node tests/mobile-layout-regression.js
          node tests/catalog-taxonomy-regression.js
          php tests/catalog-quality.php

      - name: Build private server config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p server
          PASS_B64="$(printf '%s' "$PROFISPORT_DB_PASSWORD" | base64 -w 0)"
          TOKEN_B64="$(printf '%s' "$PROFISPORT_IMPORT_TOKEN" | base64 -w 0)"
          cat > server/config.php <<PHP
          <?php
          return [
              'db_host' => 'sql202.infinityfree.com',
              'db_name' => 'if0_42771076_profisport',
              'db_user' => 'if0_42771076',
              'db_pass' => base64_decode('${PASS_B64}', true),
              'import_token' => base64_decode('${TOKEN_B64}', true),
          ];
          PHP
          chmod 600 server/config.php
        env:
          PROFISPORT_DB_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          PROFISPORT_IMPORT_TOKEN: ${{ secrets.CATALOG_TOKEN }}

      - name: Deploy to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ftpupload.net
          username: if0_42771076
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            import/**
            uploads/**
            tests/**
            docs/**
            server/config.example.php

      - name: Verify uploaded files over FTP
        shell: bash
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          FTP_ROOT='ftp://ftpupload.net/htdocs'
          AUTH="if0_42771076:${FTP_PASSWORD}"
          mkdir -p /tmp/profisport-remote/api /tmp/profisport-remote/server

          for file in index.html storefront-v2.css app.js catalog-loader.js api/health.php api/catalog.php server/catalog-quality.php; do
            echo "Downloading deployed $file for byte-for-byte verification"
            curl -fsS --retry 4 --retry-delay 2 --max-time 60 \
              --user "$AUTH" "$FTP_ROOT/$file" -o "/tmp/profisport-remote/$file"
            cmp -s "$file" "/tmp/profisport-remote/$file" || {
              echo "Remote $file differs from repository copy" >&2
              exit 1
            }
          done

          grep -Eq 'storefront-v2\.css\?v=[0-9]+' /tmp/profisport-remote/index.html
          grep -Eq 'app\.js\?v=[0-9]+' /tmp/profisport-remote/index.html
          grep -Eq 'catalog-loader\.js\?v=[0-9]+' /tmp/profisport-remote/index.html
          grep -Fq "COALESCE(price_rub,0)>0" /tmp/profisport-remote/api/catalog.php
          grep -Fq "catalog_sanitize_specs" /tmp/profisport-remote/api/catalog.php
          grep -Fq "catalog_resolve_brand" /tmp/profisport-remote/api/catalog.php
          grep -Fq "brands_inferred" /tmp/profisport-remote/api/catalog.php
          if grep -Eq 'mobile-layout-fix|mobile-viewport-lock|storefront-kant|theme-clean-v1' /tmp/profisport-remote/index.html; then
            echo 'Obsolete layout assets are present in deployed index.html' >&2
            exit 1
          fi
          echo 'InfinityFree FTP contents match the repository.'

      - name: Smoke-check public InfinityFree endpoint
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ferryffggg.infinityfreeapp.com'
          BUST="${GITHUB_SHA}-${GITHUB_RUN_NUMBER}"
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'

          curl -fsSIL --retry 4 --retry-delay 3 --max-time 30 -A "$UA" \
            "$BASE/?deploy=$BUST" | sed -n '1,40p'
          curl -fsSL --retry 4 --retry-delay 3 --max-time 30 -A "$UA" \
            "$BASE/?deploy=$BUST" -o /tmp/live.html

          if grep -Eq '/aes\.js|aes\.js' /tmp/live.html; then
            echo 'InfinityFree returned its anti-bot browser challenge to the CI runner.'
            echo 'Public endpoint is reachable; deployed bytes were verified separately over FTP.'
            exit 0
          fi

          grep -Eq 'storefront-v2\.css\?v=[0-9]+' /tmp/live.html
          grep -Eq 'app\.js\?v=[0-9]+' /tmp/live.html
          grep -Eq 'catalog-loader\.js\?v=[0-9]+' /tmp/live.html
          if grep -Eq 'mobile-layout-fix|mobile-viewport-lock|storefront-kant|theme-clean-v1' /tmp/live.html; then
            echo 'Obsolete layout assets are still present in live HTML' >&2
            exit 1
          fi
          echo 'Public InfinityFree storefront HTML passed the smoke check.'

      - name: Stock safety note
        run: |
          echo "Catalog writes are manual only."
          echo "The importer validates the verified stock field before changing product availability."
