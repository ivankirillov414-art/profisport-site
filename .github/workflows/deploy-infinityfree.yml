name: Deploy ProfiSport to InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: infinityfree-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify clean mobile layout
        run: node tests/mobile-layout-regression.js

      - name: Build private server config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p server
          PASS_B64="$(printf '%s' "$PROFISPORT_DB_PASSWORD" | base64 -w 0)"
          TOKEN_B64="$(printf '%s' "$PROFISPORT_IMPORT_TOKEN" | base64 -w 0)"
          cat > server/config.php <<PHP
          <?php
          return [
              'db_host' => 'sql202.infinityfree.com',
              'db_name' => 'if0_42771076_profisport',
              'db_user' => 'if0_42771076',
              'db_pass' => base64_decode('${PASS_B64}', true),
              'import_token' => base64_decode('${TOKEN_B64}', true),
          ];
          PHP
          chmod 600 server/config.php
        env:
          PROFISPORT_DB_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          PROFISPORT_IMPORT_TOKEN: ${{ secrets.CATALOG_TOKEN }}

      - name: Deploy to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ftpupload.net
          username: if0_42771076
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            import/**
            uploads/**
            tests/**
            docs/**
            server/config.example.php

      - name: Verify live InfinityFree response
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ferryffggg.infinityfreeapp.com'
          BUST="${GITHUB_SHA}-${GITHUB_RUN_NUMBER}"
          echo '--- live response headers ---'
          curl -fsSIL --retry 4 --retry-delay 3 --max-time 30 \
            -A 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1' \
            "$BASE/?deploy=$BUST" | sed -n '1,60p'
          echo '--- live HTML asset/meta tags ---'
          curl -fsSL --retry 4 --retry-delay 3 --max-time 30 \
            -A 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1' \
            "$BASE/?deploy=$BUST" -o /tmp/live.html
          grep -Eio '<meta[^>]+viewport[^>]*>|<link[^>]+stylesheet[^>]*>|<script[^>]+src=[^>]*>' /tmp/live.html || true
          grep -q 'storefront-v2.css?v=2' /tmp/live.html
          grep -q 'app.js?v=21' /tmp/live.html
          grep -q 'catalog-loader.js?v=19' /tmp/live.html
          if grep -Eq 'mobile-layout-fix|mobile-viewport-lock|storefront-kant|theme-clean-v1' /tmp/live.html; then
            echo 'Old layout assets are still present in live HTML' >&2
            exit 1
          fi
          echo '--- compare live assets with repository ---'
          curl -fsSL --retry 4 --retry-delay 3 --max-time 30 "$BASE/storefront-v2.css?v=2&deploy=$BUST" -o /tmp/live.css
          curl -fsSL --retry 4 --retry-delay 3 --max-time 30 "$BASE/app.js?v=21&deploy=$BUST" -o /tmp/live-app.js
          sha256sum storefront-v2.css /tmp/live.css app.js /tmp/live-app.js
          cmp -s storefront-v2.css /tmp/live.css || { echo 'Live CSS differs from repository CSS' >&2; exit 1; }
          cmp -s app.js /tmp/live-app.js || { echo 'Live app.js differs from repository app.js' >&2; exit 1; }
          echo 'Live InfinityFree HTML, CSS and JS match the repository.'

      - name: Stock safety note
        run: |
          echo "Catalog writes are manual only."
          echo "The importer validates the verified stock field before changing product availability."
