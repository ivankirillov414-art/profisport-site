name: Deploy ProfiSport to InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: infinityfree-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build private server config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p server
          PASS_B64="$(printf '%s' "$PROFISPORT_DB_PASSWORD" | base64 -w 0)"
          TOKEN_B64="$(printf '%s' "$PROFISPORT_IMPORT_TOKEN" | base64 -w 0)"
          cat > server/config.php <<PHP
          <?php
          return [
              'db_host' => 'sql202.infinityfree.com',
              'db_name' => 'if0_42771076_profisport',
              'db_user' => 'if0_42771076',
              'db_pass' => base64_decode('${PASS_B64}', true),
              'import_token' => base64_decode('${TOKEN_B64}', true),
          ];
          PHP
          chmod 600 server/config.php
        env:
          PROFISPORT_DB_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          PROFISPORT_IMPORT_TOKEN: ${{ secrets.CATALOG_TOKEN }}

      - name: Deploy to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ftpupload.net
          username: if0_42771076
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            import/**
            uploads/**

      - name: Diagnose 1C stock columns safely
        shell: bash
        continue-on-error: true
        env:
          PROFISPORT_IMPORT_TOKEN: ${{ secrets.CATALOG_TOKEN }}
        run: |
          set -u
          sleep 8
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          challenge="$(curl --http1.1 --silent --show-error -A "$UA" 'https://ferryffggg.infinityfreeapp.com/server/api.php?action=health' || true)"
          a="$(printf '%s' "$challenge" | sed -n 's/.*var a=toNumbers("\([0-9a-f]*\)").*/\1/p')"
          b="$(printf '%s' "$challenge" | sed -n 's/.*b=toNumbers("\([0-9a-f]*\)").*/\1/p')"
          c="$(printf '%s' "$challenge" | sed -n 's/.*c=toNumbers("\([0-9a-f]*\)").*/\1/p')"
          cookie=''
          if [ -n "$a" ] && [ -n "$b" ] && [ -n "$c" ]; then
            cookie="$(python3 -c 'import subprocess,sys; k,i,c=sys.argv[1:4]; p=subprocess.run(["openssl","enc","-aes-128-cbc","-d","-K",k,"-iv",i,"-nopad"],input=bytes.fromhex(c),stdout=subprocess.PIPE,check=True); print(p.stdout.hex())' "$a" "$b" "$c" 2>/dev/null || true)"
          fi
          args=(--http1.1 --silent --show-error -A "$UA" -H "X-Import-Token: ${PROFISPORT_IMPORT_TOKEN}")
          if [ -n "$cookie" ]; then args+=(-H "Cookie: __test=${cookie}"); fi
          echo '--- 1C STOCK DIAGNOSTICS ---'
          curl "${args[@]}" 'https://ferryffggg.infinityfreeapp.com/api/import-stock-diagnose.php?i=1' || true
          echo
          echo '--- END DIAGNOSTICS ---'

      - name: Note catalog import policy
        run: |
          echo "Automatic 1C import is disabled during deploy until the stock column is verified."
          echo "This prevents a deployment from corrupting stock quantities."
