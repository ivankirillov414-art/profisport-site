name: Inspect original export over FTP

on:
  push:
    branches: [codex/source-export-inspect]
    paths:
      - 'scripts/inspect_source_export.py'
      - '.github/workflows/source-export-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect existing source files without modifying the server
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/inspect_source_export.py
