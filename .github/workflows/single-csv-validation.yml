name: Single CSV upload validation
on:
  push:
    branches: [codex/single-csv-images]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: profisport_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -ptest-only-password" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded source edits
        run: python3 scripts/apply-single-csv.py
      - name: Syntax and focused regression tests
        run: |
          find api server admin tests -name '*.php' -print0 | xargs -0 -n1 php -l
          for f in admin/*.js; do node --check "$f"; done
          php tests/import-upload.php
          php tests/import-single-csv.php
          node tests/current-export-regression.js
          node tests/photo-source-ownership.js
      - name: Real HTTP scenario on disposable database
        run: |
          cat > server/config.php <<'PHP'
          <?php return ['db_host'=>'127.0.0.1','db_name'=>'profisport_test','db_user'=>'root','db_pass'=>'test-only-password','import_token'=>'test'];
          PHP
          php tests/seed.php
          php -S 127.0.0.1:8080 >/tmp/single-csv-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for i in 1 2 3 4 5; do curl -s http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
          python3 tests/import-single-csv-http.py
      - name: Commit verified code to review branch only
        run: |
          git config user.name 'ProfiSport validation'
          git config user.email 'profisport@users.noreply.github.com'
          git add admin/ api/import-apply.php api/import-upload.php server/import-upload.php .github/workflows/store-tests.yml .github/workflows/deploy-infinityfree.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Apply single CSV upload and optional categories after HTTP verification'
            git push origin HEAD:codex/single-csv-images
          fi
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-csv-reviewed-code
          path: |
            admin/
            api/
            server/*.php
            tests/
            !server/config.php
          retention-days: 3
