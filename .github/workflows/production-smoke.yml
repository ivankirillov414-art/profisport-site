name: ProfiSport production smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'server/**'
      - 'admin/**'
      - 'catalog-loader.js'
      - 'catalog-live-paged.js'
      - '.github/workflows/production-smoke.yml'

concurrency:
  group: profisport-production-smoke
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check production health and rollback-only business flow
        shell: bash
        env:
          PROFISPORT_DB_PASSWORD: ${{ secrets.DB_PASSWORD || secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          BASE='https://ferryffggg.infinityfreeapp.com'
          TOKEN="$(printf '%s' "profisport-1c-auto-v1:${PROFISPORT_DB_PASSWORD}" | sha256sum | awk '{print $1}')"
          curl -fsS --retry 4 --retry-delay 3 --max-time 30 -A 'ProfiSport-Smoke/1.0' "$BASE/api/health.php" -o /tmp/health.json
          curl -fsS --retry 4 --retry-delay 3 --max-time 30 -A 'ProfiSport-Smoke/1.0' "$BASE/api/catalog.php?limit=1&count=1" -o /tmp/catalog.json
          curl -fsS --retry 4 --retry-delay 3 --max-time 60 -A 'ProfiSport-Smoke/1.0' -H "X-Import-Token: $TOKEN" -X POST "$BASE/api/live-smoke.php" -o /tmp/smoke.json
          python3 -c "import json; h=json.load(open('/tmp/health.json')); c=json.load(open('/tmp/catalog.json')); s=json.load(open('/tmp/smoke.json')); assert h.get('ok') and h.get('database'); assert c.get('ok') and c.get('count',0)>=1 and c.get('total',0)>=1; assert s.get('ok') and s.get('rolled_back') is True and all(s.get('checks',{}).values()); print('Production health, live catalog and rollback-only business flow passed.')"
