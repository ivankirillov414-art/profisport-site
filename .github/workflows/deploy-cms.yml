name: Deploy independent CMS
on:
  push:
    branches: [main, codex/visual-cms, codex/id-cms, codex/id-cards]
    paths: ['cms/**', '.github/workflows/deploy-cms.yml']
  workflow_dispatch:
concurrency:
  group: independent-cms-deploy
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/cms-tests.yml
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate release
        run: |
          find cms -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check cms/visual.js
          node --check cms/workspace.js
          node --check cms/visual-editor.js
          node --check cms/editor.js
          php cms/tests/validation.php
          php cms/tests/visual-validation.php
          node cms/tests/blocks.js
      - name: Configure CMS database
        env:
          CMS_DB_HOST: ${{ secrets.CMS_DB_HOST || 'sql202.infinityfree.com' }}
          CMS_DB_NAME: ${{ secrets.CMS_DB_NAME || 'if0_42771076_profisport' }}
          CMS_DB_USER: ${{ secrets.CMS_DB_USER || 'if0_42771076' }}
          CMS_DB_PASSWORD: ${{ secrets.CMS_DB_PASSWORD || secrets.DB_PASSWORD || secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,base64,pathlib
          def value(key):
              encoded=base64.b64encode(os.environ[key].encode()).decode()
              return "base64_decode('"+encoded+"',true)"
          config="<?php\nreturn [\n"
          for key,env in [('db_host','CMS_DB_HOST'),('db_name','CMS_DB_NAME'),('db_user','CMS_DB_USER'),('db_pass','CMS_DB_PASSWORD')]:
              config+=" '"+key+"'=>"+value(env)+",\n"
          config+=" 'site_key'=>'profisport', 'site_name'=>'ProfiSport',\n 'connected_sites'=>['kosmosfera'],\n 'site_url'=>'https://ferryffggg.infinityfreeapp.com/',\n 'media_url'=>'https://ferryffggg.infinityfreeapp.com/cms/media/',\n];\n"
          pathlib.Path('cms/private/config.php').write_text(config)
          PY
      - name: Protect uploaded media
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl -fsS --ssl-reqd --ftp-create-dirs --retry 3 --max-time 60 \
            --user "if0_42771076:${FTP_PASSWORD}" -T cms/media/.htaccess \
            'ftp://ftpupload.net:21/htdocs/cms/media/.htaccess;type=i'
      - name: Deploy CMS only
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287
        with:
          server: ftpupload.net
          username: if0_42771076
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./cms/
          server-dir: /htdocs/cms/
          state-name: .ftp-cms-sync.json
          exclude: |
            media/**
            tests/**
            tools/**
            **/node_modules/**
            private/config.example.php
            README.md
      - name: Install image verification dependency
        run: python3 -m pip install 'Pillow==11.3.0'
      - name: Verify deployed CMS files
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            mkdir -p "/tmp/cms-verify/$(dirname "$file")"
            curl -fsS --ssl-reqd --retry 3 --max-time 60 --user "if0_42771076:${FTP_PASSWORD}" \
              "ftp://ftpupload.net:21/htdocs/$file;type=i" -o "/tmp/cms-verify/$file"
            case "$file" in
              *.webp|*.png|*.jpg|*.jpeg)
                python3 - "$file" "/tmp/cms-verify/$file" <<'PY'
          import sys
          from PIL import Image, ImageChops, ImageStat
          with Image.open(sys.argv[1]) as source, Image.open(sys.argv[2]) as remote:
              if source.size != remote.size or getattr(source, 'n_frames', 1) != 1 or getattr(remote, 'n_frames', 1) != 1:
                  raise SystemExit('Image dimensions or frame count changed: ' + sys.argv[1])
              error = max(ImageStat.Stat(ImageChops.difference(source.convert('RGBA'), remote.convert('RGBA'))).rms)
              if error > 5:
                  raise SystemExit(f'Image content differs: {sys.argv[1]}, RMS {error:.3f}')
              print(f'Verified image {sys.argv[1]}: {source.size}, RMS {error:.3f}')
          PY
                ;;
              *) cmp "$file" "/tmp/cms-verify/$file" ;;
            esac
          done < <(find cms -type f ! -path 'cms/tests/*' ! -path 'cms/tools/*' ! -path 'cms/media/*' ! -path 'cms/private/config.php' ! -path 'cms/private/config.example.php' ! -name README.md | sort)
      - name: Build portable CMS release
        run: bash cms/tools/package.sh /tmp/content-cms
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: content-cms-standalone
          path: /tmp/content-cms.zip
          retention-days: 30

  preview:
    if: github.ref == 'refs/heads/codex/visual-cms' || github.ref == 'refs/heads/codex/id-cms' || github.ref == 'refs/heads/codex/id-cards'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Assemble static editor preview
        run: |
          node --check cms/visual.js
          node --check cms/workspace.js
          python3 cms/tools/package.py .cms-preview-source --demo
      - name: Upload isolated demo
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287
        with:
          server: ftpupload.net
          username: if0_42771076
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./.cms-preview-source/
          server-dir: /htdocs/cms-preview/
          state-name: .ftp-cms-preview-sync.json
