name: Catalogue source visibility audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/catalog-source-audit.yml', 'scripts/catalog-source-audit.py']
  workflow_dispatch:
jobs:
  read-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Read product export without changing stock or catalogue
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/catalog-source-audit.py
