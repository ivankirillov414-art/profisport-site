name: Manual fallback photo research

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profisport-photo-autofill
  cancel-in-progress: false

jobs:
  autofill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Explain source policy
        run: |
          echo 'Live MySQL product images are authoritative.'
          echo 'This workflow is manual only because the static parser cannot prove that a live DB product is missing a photo.'
          echo 'Internet results are fallback candidates only and never replace a working live DB photo.'

      - name: Find high-confidence fallback candidates
        shell: bash
        run: |
          OFFSET=$(( GITHUB_RUN_NUMBER * 120 ))
          python3 scripts/photo_autofill.py --max-products 120 --max-search 40 --offset "$OFFSET"

      - name: Validate overrides
        run: |
          python3 - <<'PY'
          import json,re
          p='data/photo-overrides.json'
          j=json.load(open(p,encoding='utf-8'))
          assert isinstance(j.get('items'),dict)
          for key,row in j['items'].items():
              assert key.strip()
              assert isinstance(row,dict)
              u=str(row.get('image',''))
              assert re.match(r'^https?://',u), (key,u)
              assert row.get('name'), key
              assert int(row.get('confidence',0)) >= 85, (key,row.get('confidence'))
          print('photo overrides:',len(j['items']))
          PY

      - name: Commit newly verified fallback candidates
        shell: bash
        run: |
          if python3 - <<'PY'
          import json,subprocess,sys
          before=json.loads(subprocess.check_output(['git','show','HEAD:data/photo-overrides.json'],text=True))
          after=json.load(open('data/photo-overrides.json',encoding='utf-8'))
          sys.exit(0 if before.get('items',{})==after.get('items',{}) else 1)
          PY
          then
            git checkout -- data/photo-overrides.json
            echo 'No new high-confidence fallback candidates this run.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/photo-overrides.json
          git commit -m 'Add verified fallback photo candidates'
          git pull --rebase origin main
          git push origin HEAD:main
