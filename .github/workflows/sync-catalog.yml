name: Sync full catalog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-catalog.yml
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
concurrency:
  group: sync-full-catalog
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone private catalog source
        env:
          CATALOG_TOKEN: ${{ secrets.CATALOG_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${CATALOG_TOKEN}@github.com/ivankirillov414-art/velo56-parser.git" /tmp/velo56-parser
      - name: Build browser catalog
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          src=pathlib.Path('/tmp/velo56-parser/public-data')
          manifest=json.loads((src/'manifest.json').read_text(encoding='utf-8'))
          rows=[]
          for name in manifest['parts']:
              rows.extend(json.loads((src/name).read_text(encoding='utf-8')))
          if len(rows) != 8552:
              raise SystemExit(f'expected 8552, got {len(rows)}')
          out=pathlib.Path('data')
          out.mkdir(exist_ok=True)
          for p in out.glob('catalog-*.json'):
              p.unlink()
          chunk=250
          parts=[]
          for i in range(0,len(rows),chunk):
              name=f'catalog-{i//chunk+1:03}.json'
              (out/name).write_text(json.dumps(rows[i:i+chunk],ensure_ascii=False,separators=(',',':')),encoding='utf-8')
              parts.append(name)
          public_manifest={
              'products':len(rows),
              'chunk_size':chunk,
              'parts':parts,
              'with_images':sum(bool(r.get('images')) for r in rows)
          }
          (out/'manifest.json').write_text(json.dumps(public_manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print('verified',len(rows),'products; images',public_manifest['with_images'],'browser chunks',len(parts))
          PY
      - name: Commit complete catalog
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/manifest.json data/catalog-*.json
          git diff --cached --quiet || git commit -m 'Sync complete catalog with product images'
          git push
