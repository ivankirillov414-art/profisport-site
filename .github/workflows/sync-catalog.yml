name: Sync full catalog
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-catalog.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download complete ProfiSport catalog
        run: |
          set -euo pipefail
          mkdir -p data
          base='https://raw.githubusercontent.com/ivankirillov414-art/velo56-parser/main/public-data'
          curl -fL "$base/manifest.json" -o data/manifest.json
          python - <<'PY'
          import json, subprocess
          m=json.load(open('data/manifest.json',encoding='utf-8'))
          for name in m['parts']:
              subprocess.run(['curl','-fL',f'https://raw.githubusercontent.com/ivankirillov414-art/velo56-parser/main/public-data/{name}','-o',f'data/{name}'],check=True)
          print('downloaded',len(m['parts']),'files /',m['products'],'products')
          PY
      - name: Verify catalog
        run: |
          python - <<'PY'
          import json, pathlib
          m=json.load(open('data/manifest.json',encoding='utf-8'))
          n=0
          for name in m['parts']:
              p=pathlib.Path('data')/name
              if not p.exists(): raise SystemExit(f'missing {p}')
              n += len(json.load(open(p,encoding='utf-8')))
          if n != 8552: raise SystemExit(f'expected 8552, got {n}')
          print('verified',len(m['parts']),'files /',n,'products')
          PY
      - name: Commit catalog
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/manifest.json data/products.public-*.json
          git diff --cached --quiet || git commit -m 'Import complete 8552-product catalog'
          git push
