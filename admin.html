<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ПрофиСпорт — админ-панель</title><link rel="stylesheet" href="styles.css"><style>body{background:#f5f5f3}.admin{max-width:1180px;margin:auto;padding:24px}.panel{background:#fff;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 4px 20px #0001}.admin input,.admin textarea,.admin select{width:100%;box-sizing:border-box;padding:12px;margin:6px 0 12px;border:1px solid #ddd;border-radius:10px}.admin button{padding:12px 16px;border:0;border-radius:10px;background:#f2c94c;color:#202124;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.hidden{display:none}.productsAdmin{max-height:65vh;overflow:auto}.productAdmin{border-top:1px solid #eee;padding:14px 0}.muted{color:#777;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="admin"><h1>ПрофиСпорт · управление сайтом</h1><section id="login" class="panel"><h2>Вход</h2><label>Пользователь<input id="username" autocomplete="username" value="Иван Кириллов 414"></label><label>Пароль<input id="password" type="password" autocomplete="current-password"></label><button id="loginBtn">Войти</button><p id="loginMsg" class="muted"></p></section><div id="dashboard" class="hidden"><section class="panel"><div class="row"><h2>Редактор</h2><button id="logout">Выйти</button></div><p>Изменения сохраняются в черновик браузера. Для постоянной публикации нужен серверный API/БД — GitHub Pages сам по себе не может безопасно записывать каталог.</p><div class="grid"><label>Название магазина<input id="siteName"></label><label>Телефон<input id="sitePhone"></label><label>Адрес<input id="siteAddress"></label><label>Акцент<input id="accent" type="color"></label></div><label>Текст главного баннера<textarea id="heroText"></textarea></label><button id="saveSite">Сохранить настройки</button></section><section class="panel"><h2>Товары</h2><div class="row"><input id="productSearch" placeholder="Название, артикул, модель"><button id="newProduct">Добавить товар</button></div><div id="productsAdmin" class="productsAdmin"></div></section></div></main><script src="catalog-loader.js"></script><script src="admin.js"></script></body></html>
