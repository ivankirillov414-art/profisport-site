<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#454b53"><title>Личный кабинет — ПрофиСпорт</title><link rel="stylesheet" href="styles.css?v=16"><link rel="stylesheet" href="theme-clean-v1.css?v=1"><link rel="stylesheet" href="mobile-layout-fix.css?v=4"><style>.profilePage{max-width:900px;margin:20px auto}.profileGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.profileCard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 8px 24px #22252a0c}.profileCard h2,.profileCard h3{margin-top:0}.authTabs{display:flex;gap:8px;margin-bottom:14px}.authTabs button{box-shadow:none}.authTabs .secondary.active{background:var(--y)}.profileForm{display:grid;gap:11px}.bonus{font-size:42px;font-weight:900}.profileFav{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.profileFav a{background:#faf9f5;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px}.loyaltyRow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.hidden{display:none!important}.profileMsg{margin-top:10px;font-size:13px}@media(max-width:700px){.profileGrid{grid-template-columns:1fr}.profileFav{grid-template-columns:repeat(2,minmax(0,1fr))}.profilePage{margin:8px auto}.profileCard{padding:16px}}</style></head><body><div class="top"><b>Профи<span>Спорт</span></b><div class="topActions"><a href="index.html">← Магазин</a></div></div><main class="profilePage"><h1>Личный кабинет</h1><div id="guest"><section class="profileCard"><div class="authTabs"><button id="loginTab">Войти</button><button id="registerTab" class="secondary">Регистрация</button></div><form id="loginForm" class="profileForm"><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Пароль<input name="password" type="password" required autocomplete="current-password"></label><button>Войти</button></form><form id="registerForm" class="profileForm hidden"><label>Имя<input name="name" required autocomplete="name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Телефон<input name="phone" type="tel" autocomplete="tel"></label><label>Пароль<input name="password" type="password" minlength="8" required autocomplete="new-password"></label><button>Создать кабинет</button></form><div id="authMsg" class="profileMsg"></div></section></div><div id="account" class="hidden"><div class="profileGrid"><section class="profileCard"><h2 id="customerName"></h2><div id="customerEmail" class="muted"></div><p><button id="logout" class="secondary">Выйти</button></p></section><section class="profileCard"><h3>Бонусный баланс</h3><div class="bonus"><span id="bonus">0</span> <small>бонусов</small></div><p class="muted">Информацию об условиях бонусной программы можно уточнить в магазине.</p></section></div><section class="profileCard"><h3>Избранное</h3><div id="favorites" class="profileFav"></div></section><section class="profileCard"><h3>Мои заказы</h3><div id="customerOrders"></div></section><section class="profileCard"><h3>История бонусов</h3><div id="loyalty"></div></section></div></main><script src="catalog-loader.js?v=18"></script><script>let csrf='';const $=s=>document.querySelector(s);const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(action,opts={}){opts.headers={...(opts.headers||{}),'Content-Type':'application/json'};if(csrf)opts.headers['X-CSRF-Token']=csrf;const r=await fetch('api/customer.php?action='+action,opts);const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j}function tabs(register=false){$('#loginForm').classList.toggle('hidden',register);$('#registerForm').classList.toggle('hidden',!register);$('#loginTab').classList.toggle('secondary',register);$('#registerTab').classList.toggle('secondary',!register)}$('#loginTab').onclick=()=>tabs(false);$('#registerTab').onclick=()=>tabs(true);async function render(j){csrf=j.csrf||csrf;const u=j.customer;$('#guest').classList.toggle('hidden',!!u);$('#account').classList.toggle('hidden',!u);if(!u)return;$('#customerName').textContent=u.name;$('#customerEmail').textContent=u.email;$('#bonus').textContent=Number(u.bonus_balance||0).toLocaleString('ru-RU');const statuses={new:'Новый',confirmed:'Подтверждён',ready:'Готов к выдаче',completed:'Завершён',cancelled:'Отменён'};$('#customerOrders').innerHTML=(j.orders||[]).map(o=>`<div class="loyaltyRow"><span>${esc(o.order_number)} · ${esc(statuses[o.status]||o.status)}</span><b>${Number(o.total_rub).toLocaleString('ru-RU')} ₽</b></div>`).join('')||'<p>Заказов пока нет.</p>';let all=[];try{all=await loadRealCatalog()}catch(e){}const byId=new Map(all.map(p=>[String(p.id),p]));const fav=(j.favorites||[]).map(id=>byId.get(String(id))).filter(Boolean);$('#favorites').innerHTML=fav.length?fav.map(p=>`<a href="product.html?id=${encodeURIComponent(p.id)}"><b>${esc(p.name)}</b><br><span class="muted">${Number(p.price||0).toLocaleString('ru-RU')} ₽</span></a>`).join(''):'<p class="muted">Избранных товаров пока нет.</p>';$('#loyalty').innerHTML=(j.loyalty||[]).length?(j.loyalty||[]).map(x=>`<div class="loyaltyRow"><span>${esc(x.note||x.kind)}</span><b>${Number(x.amount)>0?'+':''}${Number(x.amount)}</b></div>`).join(''):'<p class="muted">Операций пока нет.</p>'}async function refresh(){await render(await api('me'))}$('#loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{await api('login',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});await refresh();$('#authMsg').textContent=''}catch(err){$('#authMsg').textContent='Не удалось войти. Проверьте email и пароль.'}};$('#registerForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{await api('register',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});await refresh();$('#authMsg').textContent=''}catch(err){$('#authMsg').textContent=err.message==='email_exists'?'Такой email уже зарегистрирован.':'Не удалось создать кабинет.'}};$('#logout').onclick=async()=>{await api('logout',{method:'POST',body:'{}'});csrf='';await refresh()};refresh().catch(()=>{$('#authMsg').textContent='Кабинет временно недоступен.'});</script></body></html>
