<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#454b53">
  <title>Личный кабинет — ПрофиСпорт</title>
  <link rel="stylesheet" href="storefront-v2.css?v=5">

</head>
<body>
  <div class="top"><b>Профи<span>Спорт</span></b><div class="topActions"><a href="index.html">← Магазин</a></div></div>
  <main class="profilePage">
    <h1>Личный кабинет</h1>
    <div id="guest"><section class="profileCard"><div class="authTabs"><button id="loginTab">Войти</button><button id="registerTab" class="secondary">Регистрация</button></div><form id="loginForm" class="profileForm"><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Пароль<input name="password" type="password" required autocomplete="current-password"></label><button>Войти</button></form><form id="registerForm" class="profileForm hidden"><label>Имя<input name="name" required autocomplete="name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Телефон<input name="phone" type="tel" autocomplete="tel"></label><label>Пароль<input name="password" type="password" minlength="8" required autocomplete="new-password"></label><button>Создать кабинет</button></form><div id="authMsg" class="profileMsg"></div></section></div>
    <div id="account" class="hidden">
      <div class="profileGrid"><section class="profileCard"><h2 id="customerName"></h2><div id="customerEmail" class="muted"></div><p><button id="logout" class="secondary">Выйти</button></p></section><section class="profileCard"><h3>Бонусный баланс</h3><div class="bonus"><span id="bonus">0</span> <small>бонусов</small></div><p class="muted">Информацию об условиях бонусной программы можно уточнить в магазине.</p></section></div>
      <section class="profileCard"><h3>Избранное</h3><div id="favorites" class="profileFav"></div></section>
      <section class="profileCard"><h3>Мои заказы</h3><div id="customerOrders"></div><div id="orderDetails"></div></section>
      <section class="profileCard"><h3>История бонусов</h3><div id="loyalty"></div></section>
    </div>
  </main>
  <script src="catalog-loader.js?v=19"></script>
  <script>
    let csrf='';const $=s=>document.querySelector(s);const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    async function api(action,opts={}){opts.headers={...(opts.headers||{}),'Content-Type':'application/json'};if(csrf)opts.headers['X-CSRF-Token']=csrf;const r=await fetch('api/customer.php?action='+action,opts);const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);if(j.csrf)csrf=j.csrf;return j}
    function tabs(register=false){$('#loginForm').classList.toggle('hidden',register);$('#registerForm').classList.toggle('hidden',!register);$('#loginTab').classList.toggle('secondary',register);$('#registerTab').classList.toggle('secondary',!register)}
    $('#loginTab').onclick=()=>tabs(false);$('#registerTab').onclick=()=>tabs(true);
    function guestFavoriteIds(){try{const a=JSON.parse(localStorage.getItem('ps-favorites')||'[]');return Array.isArray(a)?[...new Set(a.map(String).filter(x=>/^[1-9][0-9]*$/.test(x)))]:[]}catch(e){return[]}}
    async function mergeGuestFavorites(){const ids=guestFavoriteIds();if(!ids.length)return false;await api('favorites_merge',{method:'POST',body:JSON.stringify({product_ids:ids})});try{const a=JSON.parse(localStorage.getItem('ps-favorites')||'[]');const keep=Array.isArray(a)?a.filter(x=>!/^[1-9][0-9]*$/.test(String(x))):[];localStorage.setItem('ps-favorites',JSON.stringify(keep))}catch(e){}return true}
    const statuses={new:'Новый',confirmed:'Подтверждён',processing:'В работе',ready:'Готов к выдаче',completed:'Завершён',cancelled:'Отменён'};
    async function openOrder(number,button){const box=$('#orderDetails');button.disabled=true;box.innerHTML='<div class="orderDetails">Загрузка состава заказа…</div>';try{const j=await api('order&number='+encodeURIComponent(number),{cache:'no-store'}),o=j.order;box.innerHTML=`<div class="orderDetails"><b>${esc(o.order_number)} · ${esc(statuses[o.status]||o.status)}</b>${(j.items||[]).map(i=>`<div class="orderDetailItem"><span>${esc(i.title)} × ${Number(i.quantity)}</span><b>${Number(i.line_total_rub).toLocaleString('ru-RU')} ₽</b></div>`).join('')}<p><b>Итого: ${Number(o.total_rub).toLocaleString('ru-RU')} ₽</b></p><p class="muted">${o.delivery_method==='pickup'?'Самовывоз':'Доставка по Оренбургу'}${o.address?' · '+esc(o.address):''}</p>${o.comment?`<p>${esc(o.comment)}</p>`:''}</div>`}catch(e){box.innerHTML='<div class="orderDetails">Не удалось загрузить состав заказа.</div>'}finally{button.disabled=false}}
    async function render(j){csrf=j.csrf||csrf;const u=j.customer;$('#guest').classList.toggle('hidden',!!u);$('#account').classList.toggle('hidden',!u);if(!u)return;$('#customerName').textContent=u.name;$('#customerEmail').textContent=u.email;$('#bonus').textContent=Number(u.bonus_balance||0).toLocaleString('ru-RU');$('#customerOrders').innerHTML=(j.orders||[]).map(o=>`<div class="orderRow"><span>${esc(o.order_number)} · ${esc(statuses[o.status]||o.status)}</span><strong>${Number(o.total_rub).toLocaleString('ru-RU')} ₽</strong><button type="button" data-order="${esc(o.order_number)}">Состав</button></div>`).join('')||'<p>Заказов пока нет.</p>';document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>openOrder(b.dataset.order,b));let all=[];const ids=[...new Set((j.favorites||[]).map(String))];try{for(let i=0;i<ids.length;i+=8)all.push(...(await Promise.all(ids.slice(i,i+8).map(loadProduct))).filter(Boolean))}catch(e){}const byId=new Map(all.map(p=>[String(p.id),p]));const fav=(j.favorites||[]).map(id=>byId.get(String(id))).filter(Boolean);$('#favorites').innerHTML=fav.length?fav.map(p=>`<a href="product.html?id=${encodeURIComponent(p.id)}"><b>${esc(p.name)}</b><br><span class="muted">${Number(p.price||0).toLocaleString('ru-RU')} ₽</span></a>`).join(''):'<p class="muted">Избранных товаров пока нет.</p>';$('#loyalty').innerHTML=(j.loyalty||[]).length?(j.loyalty||[]).map(x=>`<div class="loyaltyRow"><span>${esc(x.note||x.kind)}</span><b>${Number(x.amount)>0?'+':''}${Number(x.amount)}</b></div>`).join(''):'<p class="muted">Операций пока нет.</p>'}
    async function refresh(merge=true){let j=await api('me');if(j.customer&&merge&&await mergeGuestFavorites())j=await api('me');await render(j)}
    $('#loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{await api('login',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});await refresh(true);$('#authMsg').textContent=''}catch(err){$('#authMsg').textContent='Не удалось войти. Проверьте email и пароль.'}};
    $('#registerForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{await api('register',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});await refresh(true);$('#authMsg').textContent=''}catch(err){$('#authMsg').textContent=err.message==='email_exists'?'Такой email уже зарегистрирован.':'Не удалось создать кабинет.'}};
    $('#logout').onclick=async()=>{await api('logout',{method:'POST',body:'{}'});csrf='';$('#orderDetails').innerHTML='';await refresh(false)};
    refresh(true).catch(()=>{$('#authMsg').textContent='Кабинет временно недоступен.'});
  </script>
<nav class="mobileBottomNav" aria-label="Основная навигация"><a href="index.html#catalogProducts" data-nav="catalog"><span class="navBubble"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h16"/></svg></span><span>Каталог</span></a><a href="checkout.html" data-nav="cart"><span class="navBubble"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2 11h10l2-8H6"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg></span><span>Корзина</span></a><a href="service.html" data-nav="service"><span class="navBubble"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5 5L4 17l3 3 5.7-5.7a4 4 0 0 0 5-5l-2.4 2.4-3-3z"/></svg></span><span>Сервис</span></a><a href="profile.html" data-nav="profile" class="active" aria-current="page"><span class="navBubble"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c.8-4.2 3.3-6.5 7.5-6.5s6.7 2.3 7.5 6.5"/></svg></span><span>Профиль</span></a></nav>
</body>
</html>
