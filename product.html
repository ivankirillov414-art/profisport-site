<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4b5056"><title>Товар — ПрофиСпорт</title><link rel="stylesheet" href="styles.css?v=11"></head><body><div class="top"><b>Профи<span>Спорт</span></b><div class="topActions"><a href="index.html#catalog">← Каталог</a></div></div><main><div id="productPage"><p>Загрузка товара…</p></div></main><footer><b>Профи<span>Спорт</span></b><span>Оренбург, проспект Победы, 79</span><span>Продажа · Сервис · Доставка · Гарантия</span></footer><script src="catalog-loader.js?v=10"></script><script>const rub=n=>new Intl.NumberFormat('ru-RU').format(n||0)+' ₽',esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));(async()=>{try{const all=await loadRealCatalog(),id=decodeURIComponent(new URLSearchParams(location.search).get('id')||''),p=all.find(x=>String(x.id)===id);if(!p){productPage.innerHTML='<h1>Товар не найден</h1><a class="primary" href="index.html#catalog">Вернуться в каталог</a>';return}document.title=p.name+' — ПрофиСпорт';const specs=Object.entries(p.specs||{}).map(([k,v])=>`<tr><td>${esc(k)}</td><td><b>${esc(v)}</b></td></tr>`).join('');productPage.innerHTML=`<div class="productDetail"><div class="detailImage">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}">`:'<span>🏷️</span>'}</div><div class="detailInfo"><small>${esc(p.cat)}</small><h1>${esc(p.name)}</h1><p class="stock">${esc(p.stock)}</p>${p.oldPrice?`<del>${rub(p.oldPrice)}</del>`:''}<div class="detailPrice">${rub(p.price)}</div><button id="detailAdd">Добавить в корзину</button><p>Самовывоз: Оренбург, проспект Победы, 79</p></div></div>${p.description?`<section class="detailSection"><h2>Описание</h2><p>${esc(p.description)}</p></section>`:''}${specs?`<section class="detailSection"><h2>Характеристики</h2><table>${specs}</table></section>`:''}`;detailAdd.onclick=()=>{const c=JSON.parse(localStorage.getItem('ps-cart')||'[]');c.push(p.id);localStorage.setItem('ps-cart',JSON.stringify(c));detailAdd.textContent='Добавлено ✓'}}catch(e){productPage.innerHTML='<h1>Не удалось загрузить товар</h1><a class="primary" href="index.html#catalog">Вернуться в каталог</a>';console.error(e)}})();</script></body></html>
