<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Товар — ПрофиСпорт</title><link rel="stylesheet" href="styles.css"></head><body><div class="top">Оренбург · Проспект Победы, 79</div><header><a class="logo" href="index.html">ПРОФИ<span>СПОРТ</span></a><a href="index.html#catalog">← Каталог</a></header><main><div id="productPage"><p>Загрузка товара…</p></div></main><script src="catalog-loader.js"></script><script>const rub=n=>new Intl.NumberFormat('ru-RU').format(n||0)+' ₽';(async()=>{const all=await loadRealCatalog(),id=decodeURIComponent(new URLSearchParams(location.search).get('id')||''),p=all.find(x=>String(x.id)===id);if(!p){productPage.innerHTML='<h1>Товар не найден</h1><a href="index.html">Вернуться в каталог</a>';return}document.title=p.name+' — ПрофиСпорт';const specs=Object.entries(p.specs||{}).map(([k,v])=>`<tr><td>${k}</td><td><b>${v}</b></td></tr>`).join('');productPage.innerHTML=`<div class="productDetail"><div class="detailImage">${p.image?`<img src="${p.image}" alt="">`:'🏷️'}</div><div><small>${p.cat}</small><h1>${p.name}</h1><p class="stock">${p.stock}</p>${p.oldPrice?`<del>${rub(p.oldPrice)}</del>`:''}<div class="detailPrice">${rub(p.price)}</div><button onclick="addToCart()">Добавить в корзину</button><p>Самовывоз: Оренбург, проспект Победы, 79</p></div></div>${p.description?`<section><h2>Описание</h2><p>${p.description}</p></section>`:''}${specs?`<section><h2>Характеристики</h2><table>${specs}</table></section>`:''}`;window.addToCart=()=>{const c=JSON.parse(localStorage.getItem('ps-cart')||'[]');c.push(p.id);localStorage.setItem('ps-cart',JSON.stringify(c));alert('Товар добавлен в корзину')}})();</script></body></html>
