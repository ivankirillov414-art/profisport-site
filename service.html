<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4b5056"><title>Сервис — ПрофиСпорт</title><link rel="stylesheet" href="styles.css?v=12"></head><body><div class="top"><b>Профи<span>Спорт</span></b><div class="topActions"><a href="index.html">← Магазин</a></div></div><main><section class="checkoutPage"><small>СЕРВИС ПРОФИСПОРТ</small><h1>Запись в мастерскую</h1><p>Оренбург, проспект Победы, 79</p><form id="serviceForm"><label>Имя<input required name="name" autocomplete="name"></label><label>Телефон<input required name="phone" type="tel" inputmode="tel" placeholder="+7 999 000-00-00"></label><label>Что нужно сделать?<select name="type"><option>Диагностика</option><option>Ремонт велосипеда</option><option>Настройка велосипеда</option><option>Сборка велосипеда</option><option>Другое</option></select></label><label>Опишите проблему<textarea name="problem" rows="5" placeholder="Например: не переключаются передачи"></textarea></label><button>Отправить заявку</button></form><div id="serviceDone"></div></section></main><footer><b>Профи<span>Спорт</span></b><span>Оренбург, проспект Победы, 79</span><span>Продажа · Сервис · Доставка · Гарантия</span></footer><script>serviceForm.onsubmit=e=>{e.preventDefault();const n='SV-'+Date.now().toString().slice(-7);serviceForm.style.display='none';serviceDone.innerHTML=`<h2>Заявка ${n} создана</h2><p>Это тестовая версия формы. Перед запуском подключим её к системе заявок мастерской.</p><a class="primary" href="index.html">Вернуться в магазин</a>`}</script></body></html>
