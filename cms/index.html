<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CMS — управление контентом</title><link rel="stylesheet" href="style.css"></head><body>
<div id="login" class="login"><div class="mark">C</div><h1>Управление контентом</h1><p>Войдите в отдельную панель CMS.</p><form id="loginForm"><label>Логин<input name="username" autocomplete="username" required></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><button>Войти</button></form><p id="loginStatus" role="status"></p></div>
<div id="app" hidden><aside><div class="identity"><span class="mark">C</span><div><b>Контент</b><small>ПрофиСпорт</small></div></div><p class="eyebrow">СТРАНИЦЫ</p><nav id="pages"></nav><button id="historyBtn" class="secondary">История изменений</button><a id="siteLink" target="_blank" rel="noopener">Открыть сайт ↗</a><button id="logout" class="secondary">Выйти</button></aside><main><header><div><p class="eyebrow">РЕДАКТОР САЙТА</p><h1 id="pageTitle"></h1></div><div class="actions"><button id="preview" class="secondary">Предпросмотр</button><button id="save" class="secondary">Сохранить черновик</button><button id="publish">Опубликовать</button></div></header><p id="status" role="status" aria-live="polite"></p><div class="revision"><span id="revision"></span><span>Изменения появляются на сайте после публикации.</span></div><section id="blocks" class="panel"></section><section id="fields"></section></main></div>
<dialog id="history"><div class="dialogHeader"><h2>История изменений</h2><button id="closeHistory" class="secondary">Закрыть</button></div><p>Восстановление создаёт черновик. Для изменения сайта опубликуйте его.</p><div id="historyList"></div></dialog><script src="editor.js"></script></body></html>
