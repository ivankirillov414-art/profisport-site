<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4b5056"><title>Оформление заказа — ПрофиСпорт</title><link rel="stylesheet" href="styles.css?v=16"><link rel="stylesheet" href="theme-clean-v1.css?v=1"></head><body><div class="top"><b>Профи<span>Спорт</span></b><div class="topActions"><a href="index.html">← Магазин</a><a href="profile.html">Кабинет</a></div></div><main><section class="checkoutPage"><h1>Оформление заказа</h1><div id="orderSummary"><p>Загрузка корзины…</p></div><form id="order"><label>Имя<input required name="name" autocomplete="name"></label><label>Телефон<input required name="phone" type="tel" inputmode="tel" placeholder="+7 999 000-00-00" pattern="[+0-9 ()-]{10,20}"></label><label>Email<input name="email" type="email" autocomplete="email" placeholder="Для связи и личного кабинета"></label><label>Получение<select name="delivery"><option value="pickup">Самовывоз — проспект Победы, 79</option><option value="orenburg_delivery">Доставка по Оренбургу</option></select></label><label id="addressLabel" class="hidden">Адрес доставки<input name="address"></label><label>Комментарий<textarea name="comment" rows="4"></textarea></label><button id="submitOrder">Подтвердить заказ</button></form><div id="orderMsg"></div><div id="done"></div></section></main><script src="catalog-loader.js?v=17"></script><script>const rub=n=>new Intl.NumberFormat('ru-RU').format(n||0)+' ₽',esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let cart=JSON.parse(localStorage.getItem('ps-cart')||'[]'),validCart=[],knownCustomer=null;async function loadCustomer(){try{const r=await fetch('api/customer.php?action=me',{cache:'no-store'}),j=await r.json();if(r.ok&&j.customer){knownCustomer=j.customer;order.elements.name.value=j.customer.name||'';order.elements.email.value=j.customer.email||'';order.elements.phone.value=j.customer.phone||''}}catch(e){}}(async()=>{try{await loadCustomer();const all=await loadRealCatalog(),byId=new Map(all.map(p=>[String(p.id),p])),groups=new Map;cart.forEach(id=>groups.set(String(id),(groups.get(String(id))||0)+1));let total=0,found=0;const rows=[...groups].map(([id,qty])=>{const p=byId.get(id);if(!p)return'';found+=qty;for(let i=0;i<qty;i++)validCart.push(p.id);total+=p.price*qty;return `<div class="checkoutRow"><span>${esc(p.name)} <small>× ${qty}</small></span><b>${rub(p.price*qty)}</b></div>`}).join('');orderSummary.innerHTML=rows?`${rows}<div class="checkoutTotal">Товаров: ${found}<br>Итого по текущим ценам: <b>${rub(total)}</b></div>`:'<p>Корзина пуста.</p>';if(!found)submitOrder.disabled=true}catch(e){orderSummary.innerHTML='<p>Не удалось загрузить корзину.</p>';submitOrder.disabled=true;console.error(e)}})();order.elements.delivery.onchange=()=>{addressLabel.classList.toggle('hidden',order.elements.delivery.value!=='orenburg_delivery')};order.onsubmit=async e=>{e.preventDefault();if(!validCart.length)return;const phone=order.elements.phone.value.trim();if(phone.replace(/\D/g,'').length<10){order.elements.phone.setCustomValidity('Введите корректный номер телефона');order.elements.phone.reportValidity();return}order.elements.phone.setCustomValidity('');submitOrder.disabled=true;orderMsg.textContent='Создаю заказ…';const payload={name:order.elements.name.value.trim(),phone,email:order.elements.email.value.trim(),delivery:order.elements.delivery.value,address:order.elements.address.value.trim(),comment:order.elements.comment.value.trim(),items:validCart};try{const r=await fetch('api/order-create.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||r.status);localStorage.removeItem('ps-cart');order.style.display='none';orderSummary.style.display='none';orderMsg.textContent='';done.innerHTML=`<h2>Заказ ${esc(j.order_number)} принят</h2><p>Сумма заказа: <b>${rub(j.total_rub)}</b>.</p><p>Менеджер магазина свяжется с вами для подтверждения наличия и условий получения.</p><a class="primary" href="index.html">Вернуться в магазин</a>`}catch(err){submitOrder.disabled=false;orderMsg.textContent=err.message==='out_of_stock'?'Один из товаров уже закончился. Обновите корзину.':'Не удалось создать заказ. Попробуйте ещё раз.'}}</script></body></html>
