<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Оформление заказа — ПрофиСпорт</title><link rel="stylesheet" href="styles.css"></head><body><div class="top">ПрофиСпорт · Оренбург</div><header><a class="logo" href="index.html">ПРОФИ<span>СПОРТ</span></a><a href="index.html">← Вернуться в магазин</a></header><main><section class="checkoutPage"><h1>Оформление заказа</h1><form id="order"><label>Имя<input required name="name" autocomplete="name"></label><label>Телефон<input required name="phone" type="tel" placeholder="+7 999 000-00-00"></label><label>Получение<select name="delivery"><option>Самовывоз — проспект Победы, 79</option><option>Доставка по Оренбургу</option></select></label><label>Комментарий<textarea name="comment" rows="4"></textarea></label><button>Подтвердить заказ</button></form><div id="done"></div></section></main><script>order.onsubmit=e=>{e.preventDefault();const n='PS-'+Date.now().toString().slice(-7);localStorage.removeItem('ps-cart');order.style.display='none';done.innerHTML=`<h2>Заказ ${n} принят</h2><p>Менеджер магазина свяжется с вами для подтверждения наличия, способа получения и итоговой стоимости.</p><a class="primary" href="index.html">Вернуться в магазин</a>`}</script></body></html>
