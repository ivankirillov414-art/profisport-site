<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4b5056"><title>Оформление заказа — ПрофиСпорт</title><link rel="stylesheet" href="styles.css?v=16"><link rel="stylesheet" href="theme-clean-v1.css?v=1"><link rel="stylesheet" href="mobile-layout-fix.css?v=5"><style>[hidden]{display:none!important}</style></head><body><div class="top"><b>Профи<span>Спорт</span></b><div class="topActions"><a href="index.html">← Магазин</a><a href="profile.html">Кабинет</a></div></div><main><section class="checkoutPage"><h1>Оформление заказа</h1><div id="orderSummary"><p>Загрузка корзины…</p></div><form id="order"><label>Имя<input required name="name" autocomplete="name"></label><label>Телефон<input required name="phone" type="tel" inputmode="tel" placeholder="+7 999 000-00-00" pattern="[+0-9 ()-]{10,20}"></label><label>Email<input name="email" type="email" autocomplete="email" placeholder="Для связи и личного кабинета"></label><label>Получение<select name="delivery"><option value="pickup">Самовывоз — проспект Победы, 79</option><option value="orenburg_delivery">Доставка по Оренбургу</option></select></label><label id="addressLabel" hidden>Адрес доставки<input name="address"></label><label>Комментарий<textarea name="comment" rows="4"></textarea></label><p>Оплата и наличие подтверждаются менеджером. Стоимость доставки согласовывается отдельно.</p><button id="submitOrder" disabled>Подтвердить заказ</button></form><div id="orderMsg"></div><div id="done"></div></section></main><script src="catalog-loader.js?v=18"></script><script src="checkout.js?v=2"></script></body></html>
