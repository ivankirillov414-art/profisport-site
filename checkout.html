<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4b5056"><title>Оформление заказа — ПрофиСпорт</title><link rel="stylesheet" href="styles.css?v=12"></head><body><div class="top"><b>Профи<span>Спорт</span></b><div class="topActions"><a href="index.html">← Магазин</a></div></div><main><section class="checkoutPage"><h1>Оформление заказа</h1><div id="orderSummary"><p>Загрузка корзины…</p></div><form id="order"><label>Имя<input required name="name" autocomplete="name"></label><label>Телефон<input required name="phone" type="tel" inputmode="tel" placeholder="+7 999 000-00-00" pattern="[+0-9 ()-]{10,20}"></label><label>Получение<select name="delivery"><option>Самовывоз — проспект Победы, 79</option><option>Доставка по Оренбургу</option></select></label><label>Комментарий<textarea name="comment" rows="4"></textarea></label><button>Подтвердить заказ</button></form><div id="done"></div></section></main><script src="catalog-loader.js?v=13"></script><script>const rub=n=>new Intl.NumberFormat('ru-RU').format(n||0)+' ₽',esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let cart=JSON.parse(localStorage.getItem('ps-cart')||'[]'),validCart=[];(async()=>{try{const all=await loadRealCatalog(),byId=new Map(all.map(p=>[String(p.id),p])),groups=new Map;cart.forEach(id=>groups.set(String(id),(groups.get(String(id))||0)+1));let total=0,found=0;const rows=[...groups].map(([id,qty])=>{const p=byId.get(id);if(!p)return'';found+=qty;for(let i=0;i<qty;i++)validCart.push(p.id);total+=p.price*qty;return `<div class="checkoutRow"><span>${esc(p.name)} <small>× ${qty}</small></span><b>${rub(p.price*qty)}</b></div>`}).join('');orderSummary.innerHTML=rows?`${rows}<div class="checkoutTotal">Товаров: ${found}<br>Итого: <b>${rub(total)}</b></div>`:'<p>Корзина пуста.</p>';if(!found)order.querySelector('button').disabled=true}catch(e){orderSummary.innerHTML='<p>Не удалось загрузить корзину.</p>';order.querySelector('button').disabled=true;console.error(e)}})();order.onsubmit=e=>{e.preventDefault();if(!validCart.length)return;const phone=order.elements.phone.value.trim();if(phone.replace(/\D/g,'').length<10){order.elements.phone.setCustomValidity('Введите корректный номер телефона');order.elements.phone.reportValidity();return}order.elements.phone.setCustomValidity('');const n='PS-'+Date.now().toString().slice(-7);localStorage.removeItem('ps-cart');order.style.display='none';orderSummary.style.display='none';done.innerHTML=`<h2>Заказ ${n} принят</h2><p>Менеджер магазина свяжется с вами для подтверждения наличия, способа получения и итоговой стоимости.</p><a class="primary" href="index.html">Вернуться в магазин</a>`}</script></body></html>
